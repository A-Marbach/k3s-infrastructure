apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system

spec:
  valuesContent: |-
    metrics:
      prometheus:
        addEntryPointsLabels: true
        addRoutersLabels: true
        addServicesLabels: true

        service:
          enabled: true

        serviceMonitor:
          enabled: true
          additionalLabels:
            release: monitoring
          interval: 15s
