<svg width="680" height="740" viewBox="0 0 680 740" xmlns="http://www.w3.org/2000/svg">
<title>k3s infrastructure architecture</title>
<desc>Flow from Terraform provisioning Hetzner Cloud, through Ansible configuration, into a k3s cluster running Traefik and cert-manager, hosting the DaBubble application, monitored by Prometheus and Grafana.</desc>
<style>
text { font-family: Arial, Helvetica, sans-serif; fill: #1a1a1a; }
.th { font-size: 14px; font-weight: 600; }
.ts { font-size: 12px; fill: #4a4a4a; }
.box { fill: #ffffff; stroke: #888880; stroke-width: 0.5; }
.gray { fill: #F1EFE8; stroke: #5F5E5A; }
.blue { fill: #E6F1FB; stroke: #185FA5; }
.teal { fill: #E1F5EE; stroke: #0F6E56; }
.coral { fill: #FAECE7; stroke: #993C1D; stroke-width: 1; }
.amber { fill: #FAEEDA; stroke: #854F0B; }
.arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect class="gray" x="240" y="40" width="200" height="56" rx="8"/>
<text class="th" x="340" y="60" text-anchor="middle" dominant-baseline="central">Terraform</text>
<text class="ts" x="340" y="80" text-anchor="middle" dominant-baseline="central">Provisions infrastructure</text>
<line x1="340" y1="96" x2="340" y2="140" class="arr" marker-end="url(#arrow)"/>

<rect class="blue" x="240" y="140" width="200" height="56" rx="8"/>
<text class="th" x="340" y="160" text-anchor="middle" dominant-baseline="central">Hetzner Cloud</text>
<text class="ts" x="340" y="180" text-anchor="middle" dominant-baseline="central">1 control plane, 2 workers</text>
<line x1="340" y1="196" x2="340" y2="240" class="arr" marker-end="url(#arrow)"/>

<rect class="gray" x="240" y="240" width="200" height="56" rx="8"/>
<text class="th" x="340" y="260" text-anchor="middle" dominant-baseline="central">Ansible</text>
<text class="ts" x="340" y="280" text-anchor="middle" dominant-baseline="central">Configures servers, installs k3s</text>
<line x1="340" y1="296" x2="340" y2="340" class="arr" marker-end="url(#arrow)"/>

<rect class="blue" x="240" y="340" width="200" height="56" rx="8"/>
<text class="th" x="340" y="360" text-anchor="middle" dominant-baseline="central">k3s cluster</text>
<text class="ts" x="340" y="380" text-anchor="middle" dominant-baseline="central">Kubernetes control plane</text>
<line x1="340" y1="396" x2="340" y2="440" class="arr" marker-end="url(#arrow)"/>

<rect class="teal" x="150" y="440" width="160" height="56" rx="8"/>
<text class="th" x="230" y="460" text-anchor="middle" dominant-baseline="central">Traefik</text>
<text class="ts" x="230" y="480" text-anchor="middle" dominant-baseline="central">Ingress routing</text>

<rect class="teal" x="370" y="440" width="160" height="56" rx="8"/>
<text class="th" x="450" y="460" text-anchor="middle" dominant-baseline="central">cert-manager</text>
<text class="ts" x="450" y="480" text-anchor="middle" dominant-baseline="central">Let's Encrypt TLS</text>
<line x1="340" y1="496" x2="340" y2="540" class="arr" marker-end="url(#arrow)"/>

<rect class="coral" x="240" y="540" width="200" height="56" rx="8"/>
<text class="th" x="340" y="560" text-anchor="middle" dominant-baseline="central">DaBubble</text>
<text class="ts" x="340" y="580" text-anchor="middle" dominant-baseline="central">Application, HTTPS exposed</text>
<line x1="340" y1="596" x2="340" y2="640" class="arr" marker-end="url(#arrow)"/>

<rect class="amber" x="150" y="640" width="160" height="56" rx="8"/>
<text class="th" x="230" y="660" text-anchor="middle" dominant-baseline="central">Prometheus</text>
<text class="ts" x="230" y="680" text-anchor="middle" dominant-baseline="central">Metrics collection</text>

<rect class="amber" x="370" y="640" width="160" height="56" rx="8"/>
<text class="th" x="450" y="660" text-anchor="middle" dominant-baseline="central">Grafana</text>
<text class="ts" x="450" y="680" text-anchor="middle" dominant-baseline="central">Dashboards + alerting</text>
</svg>
