---
- name: Check whether k3s is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Download k3s installation script
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /tmp/install-k3s.sh
    mode: "0755"
  when: not k3s_binary.stat.exists

- name: Install k3s server
  ansible.builtin.command:
    cmd: /tmp/install-k3s.sh
  environment:
    INSTALL_K3S_EXEC: >-
      server
      --write-kubeconfig-mode 0644
      --node-name {{ inventory_hostname }}
  when: not k3s_binary.stat.exists
  notify: Restart k3s

- name: Ensure k3s service is enabled and running
  ansible.builtin.systemd:
    name: k3s
    enabled: true
    state: started

- name: Wait for Kubernetes API server
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 6443
    delay: 5
    timeout: 180

- name: Wait for k3s agent token file
  ansible.builtin.wait_for:
    path: /var/lib/rancher/k3s/server/agent-token
    timeout: 120

- name: Read k3s agent token
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/agent-token
  register: k3s_agent_token_raw
  no_log: true

- name: Store k3s agent token as host fact
  ansible.builtin.set_fact:
    k3s_agent_token: "{{ k3s_agent_token_raw.content | b64decode | trim }}"
  no_log: true

- name: Wait until Kubernetes control-plane node is ready
  ansible.builtin.command:
    cmd: >-
      /usr/local/bin/k3s kubectl
      get node {{ inventory_hostname }}
      -o jsonpath={.status.conditions[?(@.type=="Ready")].status}
  register: k3s_node_ready
  changed_when: false
  retries: 24
  delay: 5
  until: k3s_node_ready.stdout == "True"
