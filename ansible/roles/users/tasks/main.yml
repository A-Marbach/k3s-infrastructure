---
- name: Create admin user
  ansible.builtin.user:
    name: artur
    groups: sudo
    append: true
    shell: /bin/bash
    create_home: true
    state: present

- name: Create SSH directory for admin user
  ansible.builtin.file:
    path: /home/artur/.ssh
    state: directory
    owner: artur
    group: artur
    mode: "0700"

- name: Add SSH public key for admin user
  ansible.posix.authorized_key:
    user: artur
    state: present
    key: "{{ lookup('file', lookup('env', 'HOME') + '/.ssh/id_ed25519.pub') }}"

- name: Allow admin user passwordless sudo
  ansible.builtin.copy:
    dest: /etc/sudoers.d/artur
    content: "artur ALL=(ALL) NOPASSWD: ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: "/usr/sbin/visudo -cf %s"