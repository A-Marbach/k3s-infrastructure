---
- name: Install UFW
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true

- name: Set default incoming policy to deny
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Set default outgoing policy to allow
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Allow SSH
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    comment: SSH

- name: Allow HTTP
  community.general.ufw:
    rule: allow
    port: "80"
    proto: tcp
    comment: HTTP

- name: Allow HTTPS
  community.general.ufw:
    rule: allow
    port: "443"
    proto: tcp
    comment: HTTPS

- name: Allow k3s API server
  community.general.ufw:
    rule: allow
    port: "6443"
    proto: tcp
    comment: k3s API server

- name: Allow traffic from k3s pod network
  community.general.ufw:
    rule: allow
    src: "10.42.0.0/16"
    comment: k3s pod network

- name: Allow traffic from k3s service network
  community.general.ufw:
    rule: allow
    src: "10.43.0.0/16"
    comment: k3s service network

- name: Enable UFW
  community.general.ufw:
    state: enabled
