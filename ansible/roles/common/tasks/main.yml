---
- name: Update apt package cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade installed packages
  ansible.builtin.apt:
    upgrade: dist

- name: Install basic system packages
  ansible.builtin.apt:
    name:
      - curl
      - git
      - vim
      - htop
      - unzip
      - ca-certificates
    state: present
